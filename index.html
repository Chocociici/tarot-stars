<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книга Судеб</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Marck+Script&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow-x: hidden; }
body {
    font-family: 'Caveat', cursive;
    min-height: 100vh;
    background: linear-gradient(to bottom, #e3e1cf 0%, #cdcd97 100%);
    background-attachment: fixed;
    position: relative;
}

/* ===== КУСТЫ ===== */
.bushes-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bush { position: absolute; filter: blur(3px); }
.bush.b1 { width: 500px; height: 500px; bottom: -240px; left: -220px; background: #d8b267; border-radius: 45% 55% 60% 40% / 50% 60% 40% 50%; }
.bush.b2 { width: 320px; height: 320px; bottom: -140px; left: -100px; background: #d0a043; border-radius: 55% 45% 50% 50% / 60% 40% 60% 40%; }
.bush.b3 { width: 550px; height: 550px; bottom: -260px; right: -240px; background: #d8b267; border-radius: 50% 50% 40% 60% / 55% 45% 55% 45%; }
.bush.b4 { width: 340px; height: 340px; bottom: -160px; right: -120px; background: #d0a043; border-radius: 40% 60% 55% 45% / 45% 55% 45% 55%; }
.bush.b5 { width: 420px; height: 220px; bottom: -100px; left: 50%; transform: translateX(-50%); background: #d8b267; border-radius: 50% 50% 40% 40% / 100% 100% 0 0; }
.bush.b6 { width: 260px; height: 340px; top: 35%; left: -160px; background: #d0a043; border-radius: 50% 50% 60% 40% / 55% 45% 55% 45%; }
.bush.b7 { width: 280px; height: 360px; top: 55%; right: -170px; background: #d0a043; border-radius: 45% 55% 40% 60% / 50% 50% 50% 50%; }
.bush.b8 { width: 220px; height: 220px; top: 180px; right: -120px; background: #d8b267; border-radius: 55% 45% 50% 50% / 60% 40% 60% 40%; }
.bush.b9 { width: 200px; height: 200px; top: 240px; left: -110px; background: #d8b267; border-radius: 45% 55% 55% 45% / 55% 45% 55% 45%; }

/* ===== ШАПКА ===== */
header {
    background: #620f81;
    box-shadow: 0 0 25px 4px #7b1796;
    border: 2px solid #43045a;
    position: sticky; top: 0; z-index: 100;
    padding: 16px 24px;
    display: flex; justify-content: center; align-items: center;
    gap: 40px; flex-wrap: wrap;
}
header nav a {
    color: #fff; text-decoration: none;
    font-family: 'Marck Script', cursive;
    font-size: 24px; padding: 4px 8px;
    position: relative; cursor: pointer;
    transition: color 0.3s, text-shadow 0.3s;
}
header nav a::after {
    content: ''; position: absolute; left: 8px; right: 8px; bottom: -2px;
    height: 2px; background: #ffd84d;
    transform: scaleX(0); transform-origin: center;
    transition: transform 0.35s ease;
}
header nav a:hover { color: #ffd84d; text-shadow: 0 0 12px rgba(255,216,77,0.7); }
header nav a:hover::after { transform: scaleX(1); }

/* ===== MAIN ===== */
main {
    position: relative; z-index: 2;
    max-width: 1000px; margin: 0 auto;
    padding: 10px 20px 50px;
    display: flex; flex-direction: column;
    align-items: center; gap: 0;
}

/* ===== SVG-ТЫКВА (кликабельная, squash, спам) ===== */
.svg-scene {
    width: 100%; max-width: 380px;
    aspect-ratio: 1/1; position: relative;
    filter: drop-shadow(0 10px 30px rgba(99,50,7,0.35));
    cursor: pointer;
    transform-origin: center bottom;
    transition: filter 0.3s ease;
    margin-top: 10px;
    margin-bottom: 0;
    user-select: none;
}
.svg-scene:hover {
    filter: drop-shadow(0 14px 36px rgba(99,50,7,0.5));
}
@keyframes pumpkinSquash {
    0%   { transform: scaleX(1)    scaleY(1);    }
    15%  { transform: scaleX(1.18) scaleY(0.82); }
    30%  { transform: scaleX(0.92) scaleY(1.08); }
    45%  { transform: scaleX(1.08) scaleY(0.94); }
    60%  { transform: scaleX(0.97) scaleY(1.03); }
    75%  { transform: scaleX(1.02) scaleY(0.98); }
    90%  { transform: scaleX(1.005) scaleY(0.995); }
    100% { transform: scaleX(1)    scaleY(1);    }
}
.svg-scene.squash {
    animation: pumpkinSquash 0.85s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
}
.svg-scene .frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain; display: none;
    pointer-events: none;
}
.svg-scene .frame.active { display: block; }

/* ===== ОБЛОЖКА (сближена с тыквой) ===== */
.book-stage {
    width: 100%;
    display: flex; justify-content: center;
    align-items: flex-start;
    perspective: 2600px;
    min-height: 460px;
    position: relative;
    margin-top: -90px;
}
#bookCover {
    width: 280px; max-width: 80vw;
    cursor: pointer;
    filter: drop-shadow(0 14px 30px rgba(0,0,0,0.45));
    transition: transform 0.4s ease, filter 0.4s ease, opacity 0.6s;
    transform-style: preserve-3d;
    margin-top: 0;
}
#bookCover:hover { transform: translateY(-6px) rotateY(-6deg) scale(1.02); filter: drop-shadow(0 20px 40px rgba(0,0,0,0.55)); }
#bookCover.shake { animation: bookShake 0.7s cubic-bezier(.36,.07,.19,.97); }
@keyframes bookShake {
    0%, 100% { transform: translateX(0) rotateZ(0) scale(1); }
    10% { transform: translateX(-10px) rotateZ(-4deg) scale(1.02); }
    25% { transform: translateX(10px) rotateZ(4deg) scale(1.03); }
    40% { transform: translateX(-8px) rotateZ(-3deg) scale(1.02); }
    55% { transform: translateX(8px) rotateZ(3deg) scale(1.03); }
    70% { transform: translateX(-5px) rotateZ(-2deg) scale(1.01); }
    85% { transform: translateX(5px) rotateZ(2deg) scale(1.01); }
    100% { transform: translateX(0) rotateZ(0) scale(1); }
}
#bookCover.opening { animation: bookOpenCover 1s ease-in forwards; }
@keyframes bookOpenCover { to { opacity: 0; transform: scale(1.15) rotateY(60deg); } }

/* ===== 3D КНИГА ===== */
.book-3d {
    display: none;
    width: 100%; max-width: 860px;
    height: 500px;
    position: relative;
    transform-style: preserve-3d;
}
.book-3d.visible { display: block; }

.book-inner {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    background: linear-gradient(135deg, #8b6b47 0%, #a67c52 55%, #8b6b47 100%);
    border-left: 7px solid #633207;
    border-right: 7px solid #633207;
    border-radius: 10px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55), inset 0 0 60px rgba(0,0,0,0.25);
    overflow: hidden;
}
.book-inner::before {
    content: '';
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 40px; transform: translateX(-50%);
    background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 50%, rgba(0,0,0,0) 100%);
    pointer-events: none; z-index: 5;
}

.page-slot { position: relative; flex: 1; height: 100%; overflow: hidden; }

.book-page {
    position: absolute; inset: 0;
    padding: 40px 32px 60px;
    color: #fff;
    font-family: 'Caveat', cursive;
    font-size: 24px;
    line-height: 1.55;
    user-select: none;
    overflow-y: auto;
    background: linear-gradient(160deg, rgba(139,107,71,0.98), rgba(166,124,82,0.98));
    display: flex; flex-direction: column; justify-content: center;
    backface-visibility: hidden;
    transform-style: preserve-3d;
}
.book-page::before {
    content: ''; position: absolute; inset: 12px;
    border: 1px solid rgba(255,216,77,0.25);
    border-radius: 6px; pointer-events: none;
}
.book-page.left-page { border-right: 1px solid rgba(99,50,7,0.4); transform-origin: right center; }
.book-page.right-page { border-left: 1px solid rgba(99,50,7,0.4); transform-origin: left center; }
.book-page.left-page::after,
.book-page.right-page::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 30px; pointer-events: none;
}
.book-page.left-page::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.3), transparent); }
.book-page.right-page::after { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.3), transparent); }

.flip-page {
    position: absolute; top: 0; height: 100%; width: 50%;
    z-index: 30; pointer-events: none;
    backface-visibility: hidden;
    transform-style: preserve-3d;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    overflow: hidden;
}
.flip-page .book-page {
    position: absolute; inset: 0; width: 100%; height: 100%;
    padding: 40px 32px 60px; font-size: 24px; line-height: 1.55;
    display: flex; flex-direction: column; justify-content: center;
    background: linear-gradient(160deg, rgba(139,107,71,0.98), rgba(166,124,82,0.98));
    color: #fff;
}
.flip-page.flip-right { right: 0; transform-origin: left center; }
.flip-page.flip-left { left: 0; transform-origin: right center; }

/* кликабельные слова */
.owl-word, .croc-word, .tiger-word, .sheep-word {
    font-weight: 700; cursor: pointer;
    display: inline-block; position: relative;
    font-family: 'Marck Script', cursive;
    transition: text-shadow 0.3s, transform 0.3s;
}
.owl-word { color: #ffd84d; text-shadow: 0 0 10px rgba(255,216,77,0.7); }
.owl-word:hover { text-shadow: 0 0 22px rgba(255,216,77,1), 0 0 40px rgba(255,216,77,0.8); transform: scale(1.08); }
.croc-word { color: #7ed957; text-shadow: 0 0 10px rgba(126,217,87,0.7); }
.croc-word:hover { text-shadow: 0 0 22px rgba(126,217,87,1), 0 0 40px rgba(126,217,87,0.8); transform: scale(1.08); }
.tiger-word { color: #ff9a3c; text-shadow: 0 0 10px rgba(255,154,60,0.7); }
.tiger-word:hover { text-shadow: 0 0 22px rgba(255,154,60,1), 0 0 40px rgba(255,154,60,0.8); transform: scale(1.08); }
.sheep-word { color: #a8c8e8; text-shadow: 0 0 10px rgba(168,200,232,0.7); }
.sheep-word:hover { text-shadow: 0 0 22px rgba(168,200,232,1), 0 0 40px rgba(168,200,232,0.8); transform: scale(1.08); }

.book-toolbar {
    position: absolute; bottom: 12px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 22px; z-index: 10; pointer-events: none;
}
.book-toolbar > * { pointer-events: auto; }
.book-toolbar button {
    background: rgba(255,216,77,0.15);
    border: 1.5px solid rgba(255,216,77,0.6);
    color: #ffd84d; width: 44px; height: 44px;
    border-radius: 50%; cursor: pointer; font-size: 22px;
    font-family: inherit; transition: all 0.3s;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
}
.book-toolbar button:hover { background: rgba(255,216,77,0.35); box-shadow: 0 0 18px rgba(255,216,77,0.7); transform: scale(1.08); }
.book-toolbar button:disabled { opacity: 0.3; cursor: default; }
.book-toolbar button:disabled:hover { transform: none; box-shadow: none; }
.page-indicator {
    font-family: 'Caveat', cursive; color: #ffd84d;
    font-size: 20px; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(0,0,0,0.5);
}
.book-close-btn {
    position: absolute; top: 12px; right: 14px; z-index: 20;
    background: rgba(255,216,77,0.15);
    border: 1.5px solid rgba(255,216,77,0.6);
    color: #ffd84d; width: 38px; height: 38px;
    border-radius: 50%; cursor: pointer; font-size: 18px;
    transition: all 0.3s;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
}
.book-close-btn:hover { background: rgba(255,216,77,0.35); transform: rotate(90deg) scale(1.1); box-shadow: 0 0 15px rgba(255,216,77,0.7); }

/* ===== ЗВЁЗДЫ ===== */
.star-particle {
    position: fixed; pointer-events: none; z-index: 950;
    will-change: transform, opacity;
    text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
}

/* ===== КАРТА ===== */
.card-flight-overlay {
    position: fixed; inset: 0; z-index: 1200;
    display: flex; align-items: center; justify-content: center;
    background: rgba(20,5,30,0); pointer-events: none;
    transition: background 0.6s;
}
.card-flight-overlay.reveal {
    background: rgba(20,5,30,0.72);
    pointer-events: auto;
    backdrop-filter: blur(3px);
}
@keyframes cardEmergence {
    0%   { opacity: 0; transform: scale(0.02) rotate(0deg); filter: brightness(3) blur(20px); }
    8%   { opacity: 1; transform: scale(0.25) rotate(360deg); filter: brightness(2.4) blur(10px); }
    33%  { transform: scale(0.5) rotate(720deg); filter: brightness(1.8) blur(4px); }
    55%  { transform: scale(0.75) rotate(1080deg); filter: brightness(1.4) blur(1px); }
    78%  { transform: scale(1.15) rotate(1080deg); filter: brightness(1.1) blur(0); }
    90%  { transform: scale(0.96) rotate(1080deg); filter: brightness(1) blur(0); }
    100% { opacity: 1; transform: scale(1) rotate(1080deg); filter: brightness(1) blur(0); }
}
.flight-card {
    width: 260px; max-width: 72vw;
    background: #fff; border-radius: 14px;
    padding: 14px;
    box-shadow: 0 0 60px rgba(255,216,77,0.8), 0 20px 60px rgba(0,0,0,0.6);
    animation: cardEmergence 2.6s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    position: relative;
    transform: rotate(1080deg);
    cursor: grab;
}
.flight-card.settled { animation: none; transform: scale(1) rotate(1080deg); opacity: 1; }
.flight-card:active { cursor: grabbing; }
.flight-card::before {
    content: ''; position: absolute; inset: 5px;
    border: 2px solid #e0d5b8; border-radius: 10px; pointer-events: none;
}
.flight-card img { width: 100%; height: auto; border-radius: 8px; display: block; pointer-events: none; }
.card-actions {
    position: absolute; bottom: -70px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 14px;
    opacity: 0; transition: opacity 0.5s 0.2s;
}
.card-flight-overlay.reveal .card-actions { opacity: 1; }
.card-actions button {
    font-family: 'Caveat', cursive; font-size: 20px;
    padding: 8px 26px; border-radius: 30px;
    border: 2px solid #ffd84d;
    background: rgba(98,15,129,0.85);
    color: #ffd84d; cursor: pointer;
    transition: all 0.3s;
    backdrop-filter: blur(6px);
}
.card-actions button:hover {
    background: #ffd84d; color: #43045a;
    box-shadow: 0 0 25px rgba(255,216,77,0.9);
    transform: translateY(-2px);
}

/* ===== СЕКЦИИ ===== */
.section {
    display: none;
    position: relative; z-index: 2;
    width: 100%; max-width: 1100px;
    margin: 0 auto; padding: 20px 20px 60px;
}
.section.active { display: block; }
.section h2 {
    text-align: center;
    font-family: 'Marck Script', cursive;
    color: #43045a; font-size: 42px;
    margin-bottom: 35px;
    text-shadow: 0 2px 8px rgba(255,255,255,0.6);
}

/* ===== ГАЛЕРЕЯ — ДОСКА ===== */
.gallery-board {
    position: relative;
    padding: 50px 40px;
    border-radius: 16px;
    background:
        repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 6px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 5px),
        radial-gradient(circle at 30% 20%, #c9a66b 0%, #b08b52 60%, #96713e 100%);
    box-shadow: inset 0 0 60px rgba(60,30,5,0.45), 0 20px 60px rgba(0,0,0,0.45);
    border: 10px solid #6b4a24;
    border-radius: 18px;
    outline: 2px solid #4a3015;
}
.gallery-board::before {
    content: '';
    position: absolute; inset: -10px;
    border-radius: 18px;
    pointer-events: none;
    box-shadow: inset 0 0 0 2px rgba(255,220,150,0.15);
}
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 38px 30px;
    position: relative; z-index: 1;
}
.gallery-cell { position: relative; display: flex; flex-direction: column; align-items: center; }
.gallery-card {
    position: relative;
    background: #fffdf6;
    border-radius: 4px;
    padding: 10px 10px 34px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.35), 0 2px 3px rgba(0,0,0,0.2);
    aspect-ratio: 2/3;
    display: flex; align-items: center; justify-content: center;
    overflow: visible;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    transform: rotate(var(--tilt, 0deg));
}
.gallery-card.opened:hover {
    transform: rotate(0deg) scale(1.04);
    box-shadow: 0 14px 30px rgba(0,0,0,0.45), 0 4px 8px rgba(0,0,0,0.25);
    z-index: 5;
}
.gallery-card img {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 2px; display: block;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
}
.gallery-card::before {
    content: '';
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff6b6b 0%, #d92b2b 45%, #8a0f0f 100%);
    box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(0,0,0,0.3), inset 2px 2px 3px rgba(255,255,255,0.5);
    z-index: 10;
    pointer-events: none;
}
.gallery-card::after {
    content: '';
    position: absolute;
    top: -8px; left: 50%;
    transform: translateX(-50%) translateX(-5px);
    width: 8px; height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
    z-index: 11;
    pointer-events: none;
}
.gallery-meaning {
    font-family: 'Caveat', cursive;
    font-size: 17px;
    color: #2a1a08;
    text-align: center;
    margin-top: 10px;
    line-height: 1.25;
    max-width: 180px;
    background: rgba(255,253,246,0.85);
    border-radius: 4px;
    padding: 4px 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}
.gallery-card.dark {
    background: #2a1a10;
    border: 2px solid #633207;
    padding: 10px;
    aspect-ratio: 2/3;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 50%, #3a2410 0%, #1a0e05 100%);
}
.gallery-card.dark::before {
    content: '';
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6b6b6b 0%, #3a3a3a 45%, #111 100%);
    box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset -2px -2px 4px rgba(0,0,0,0.4), inset 2px 2px 3px rgba(255,255,255,0.25);
    z-index: 10;
    pointer-events: none;
}
.gallery-card.dark::after {
    content: '???';
    position: absolute;
    font-family: 'Marck Script', cursive;
    font-size: 34px;
    color: #ffd84d;
    text-shadow: 0 0 15px rgba(255,216,77,0.5);
    letter-spacing: 4px;
    z-index: 2;
}
.sticker {
    position: absolute;
    top: 8px; right: -18px;
    background: #f4e4c1;
    border: 1px dashed #633207;
    padding: 4px 26px;
    font-family: 'Caveat', cursive;
    font-size: 16px;
    color: #633207;
    transform: rotate(35deg);
    box-shadow: 2px 3px 8px rgba(0,0,0,0.3);
    z-index: 3;
    letter-spacing: 1px;
    font-weight: 700;
}

/* ===== ОБО МНЕ ===== */
.profile-wrap { display: flex; justify-content: center; }
.profile-card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 40px 45px;
    box-shadow: 0 20px 60px rgba(99,50,7,0.3);
    border: 2px solid rgba(98,15,129,0.2);
    display: flex; flex-direction: column;
    align-items: center; gap: 28px;
    max-width: 500px; width: 100%;
}
.profile-avatar {
    width: 140px; height: 140px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #620f81;
    box-shadow: 0 0 0 6px rgba(255,216,77,0.5), 0 10px 30px rgba(0,0,0,0.3);
    background: #e3e1cf;
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.profile-fields { width: 100%; display: flex; flex-direction: column; gap: 16px; }
.profile-field { display: flex; flex-direction: column; gap: 4px; }
.profile-field label {
    font-family: 'Caveat', cursive;
    font-size: 18px; color: #620f81;
    font-weight: 700; letter-spacing: 0.5px;
}
.profile-field input {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    padding: 10px 16px;
    border: 2px solid rgba(98,15,129,0.3);
    border-radius: 12px;
    background: rgba(255,255,255,0.7);
    color: #43045a;
    transition: all 0.3s;
    outline: none;
}
.profile-field input:focus {
    border-color: #620f81;
    box-shadow: 0 0 0 4px rgba(255,216,77,0.4);
    background: #fff;
}
.profile-about {
    width: 100%;
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: #43045a;
    text-align: center;
    line-height: 1.5;
    padding: 20px;
    background: rgba(255,216,77,0.2);
    border-radius: 16px;
    border: 1.5px dashed rgba(98,15,129,0.4);
}

/* ===== АДАПТИВ ===== */
@media (max-width: 768px) {
    header { gap: 22px; padding: 12px 16px; }
    header nav a { font-size: 20px; }

    .svg-scene { margin-top: 4px; margin-bottom: 0; }

    .book-3d { height: auto; aspect-ratio: 3 / 4; max-width: 420px; max-height: 520px; }
    .book-inner { flex-direction: row; }
    .page-slot { height: 100%; flex: 1; }
    .page-slot.left-slot-mobile { flex: 1; }
    .page-slot.right-slot-mobile { display: none; }
    .book-inner::before { display: none; }
    .book-page { padding: 34px 18px 64px; font-size: 17px; line-height: 1.45; border: none !important; }
    .book-page::before { inset: 8px; }
    .book-page.left-page::after, .book-page.right-page::after { display: none; }
    .flip-page { width: 100% !important; height: 100% !important; top: 0 !important; left: 0 !important; right: 0 !important; }
    .flip-page.flip-right { transform-origin: left center !important; }
    .flip-page.flip-left { transform-origin: right center !important; }
    .flip-page .book-page { padding: 34px 18px 64px; font-size: 17px; line-height: 1.45; }

    .book-toolbar { padding: 0 14px; bottom: 10px; }
    .book-toolbar button { width: 38px; height: 38px; font-size: 19px; }
    .page-indicator { font-size: 17px; }
    .book-close-btn { width: 34px; height: 34px; font-size: 16px; top: 10px; right: 10px; }

    .flight-card { width: 220px; }
    .gallery-board { padding: 40px 20px; border-width: 7px; }
    .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 30px 20px; }
    .gallery-card.dark::after { font-size: 24px; }
    .sticker { font-size: 12px; padding: 3px 18px; right: -14px; }
    .gallery-meaning { font-size: 15px; max-width: 140px; }
    .gallery-card::before { width: 22px; height: 22px; top: -12px; }
    .gallery-card.dark::before { width: 22px; height: 22px; top: -12px; }
    .section h2 { font-size: 32px; }
    .profile-card { padding: 28px 24px; }
    .book-stage { margin-top: -50px; }
}

@media (max-width: 480px) {
    header { gap: 14px; }
    header nav a { font-size: 17px; }
    .svg-scene { max-width: 280px; margin-top: 2px; }
    #bookCover { width: 200px; }
    .book-3d { aspect-ratio: 3 / 4.1; max-width: 360px; max-height: 480px; }
    .book-page { padding: 28px 14px 58px; font-size: 14px; line-height: 1.4; }
    .flip-page .book-page { padding: 28px 14px 58px; font-size: 14px; }
    .book-page::before { inset: 6px; }
    .book-toolbar { padding: 0 10px; bottom: 8px; }
    .book-toolbar button { width: 34px; height: 34px; font-size: 17px; }
    .page-indicator { font-size: 15px; }
    .book-close-btn { width: 30px; height: 30px; font-size: 14px; top: 8px; right: 8px; }
    .flight-card { width: 180px; }
    .gallery-board { padding: 34px 14px; border-width: 6px; }
    .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 26px 14px; }
    .gallery-card.dark::after { font-size: 20px; letter-spacing: 2px; }
    .gallery-meaning { font-size: 13px; max-width: 110px; }
    .profile-avatar { width: 110px; height: 110px; }
    .profile-field input { font-size: 19px; }
    .book-stage { margin-top: -40px; }
}
</style>
</head>
<body>

<div class="bushes-bg">
    <div class="bush b1"></div><div class="bush b2"></div><div class="bush b3"></div>
    <div class="bush b4"></div><div class="bush b5"></div><div class="bush b6"></div>
    <div class="bush b7"></div><div class="bush b8"></div><div class="bush b9"></div>
</div>

<header>
    <nav><a data-section="main">Главная</a></nav>
    <nav><a data-section="gallery">Галерея</a></nav>
    <nav><a data-section="about">Обо мне</a></nav>
</header>

<main id="mainView">
    <!-- Тыква: кликабельная, squash-анимация, можно спамить -->
    <div class="svg-scene" id="svgScene" title="Нажми на меня">
        <img class="frame active" src="ikon1.svg" alt="Кадр 1">
        <img class="frame" src="ikon2.svg" alt="Кадр 2">
        <img class="frame" src="ikon3.svg" alt="Кадр 3">
    </div>

    <div class="book-stage">
        <img id="bookCover" src="book.svg" alt="Книга Судеб">
        <div class="book-3d" id="book3d">
            <button class="book-close-btn" id="closeBook" title="Закрыть">✕</button>
            <div class="book-inner">
                <div class="page-slot left-slot-mobile" id="slotLeft"></div>
                <div class="page-slot right-slot-mobile" id="slotRight"></div>
            </div>
            <div class="book-toolbar">
                <button id="prevPage" title="Назад">‹</button>
                <span class="page-indicator" id="pageIndicator">1 / 3</span>
                <button id="nextPage" title="Вперёд">›</button>
            </div>
        </div>
    </div>
</main>

<section class="section" id="galleryView">
    <h2>Галерея карт</h2>
    <div class="gallery-board">
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>
</section>

<section class="section" id="aboutView">
    <h2>Обо мне</h2>
    <div class="profile-wrap">
        <div class="profile-card">
            <div class="profile-avatar">
                <img src="gif1.gif" alt="Ангелина"
                    onerror="this.style.background='linear-gradient(135deg,#620f81,#43045a)';this.removeAttribute('src');">
            </div>
            <div class="profile-fields">
                <div class="profile-field"><label>Имя</label><input type="text" value="Ангелина" readonly></div>
                <div class="profile-field"><label>Возраст</label><input type="text" value="20" readonly></div>
                <div class="profile-field"><label>Город</label><input type="text" value="Ульяновск" readonly></div>
                <div class="profile-field"><label>Хобби</label><input type="text" value="Рисование" readonly></div>
            </div>
            <div class="profile-about">
                Я делаю для вас, надеясь, что сделаю кому-то удобнее повседневные задачи.
            </div>
        </div>
    </div>
</section>

<script>
/* ===== SVG ===== */
const svgScene = document.getElementById('svgScene');
(function svgCycle() {
    const frames = document.querySelectorAll('#svgScene .frame');
    let idx = 0;
    setInterval(() => {
        frames[idx].classList.remove('active');
        idx = (idx + 1) % frames.length;
        frames[idx].classList.add('active');
    }, 2000);
})();

/* Клик по тыкве — squash-анимация, можно спамить (каждый клик перезапускает) */
svgScene.addEventListener('click', () => {
    svgScene.classList.remove('squash');
    void svgScene.offsetWidth; /* reflow — сброс анимации */
    svgScene.classList.add('squash');
});
svgScene.addEventListener('animationend', () => {
    svgScene.classList.remove('squash');
});

/* ===== ГАЛЕРЕЯ: localStorage ===== */
const STORAGE_KEY = 'book_of_fate_gallery_v5';
const TOTAL_CARDS = 10;
let cardStates = [];

function loadStates() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length === TOTAL_CARDS) {
                cardStates = parsed;
                return;
            }
        }
    } catch (e) {}
    cardStates = new Array(TOTAL_CARDS).fill(null);
}
function saveStates() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cardStates)); } catch (e) {}
}
function unlockCard(img, meaning) {
    if (isCardUnlocked(img)) return;
    const idx = cardStates.findIndex(s => s === null);
    if (idx === -1) return;
    cardStates[idx] = { img, meaning };
    saveStates();
}
function isCardUnlocked(img) {
    return cardStates.some(s => s && s.img === img);
}

/* ===== НАВИГАЦИЯ ===== */
const mainView = document.getElementById('mainView');
const galleryView = document.getElementById('galleryView');
const aboutView = document.getElementById('aboutView');
const allSections = document.querySelectorAll('.section');

function showSection(name) {
    mainView.style.display = name === 'main' ? 'flex' : 'none';
    allSections.forEach(s => s.classList.remove('active'));
    if (name === 'gallery') { galleryView.classList.add('active'); buildGallery(); }
    else if (name === 'about') aboutView.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.querySelectorAll('header nav a').forEach(a => {
    a.addEventListener('click', () => showSection(a.dataset.section));
});

/* ===== МОБИЛЬНЫЙ РЕЖИМ ===== */
const MOBILE_BREAKPOINT = 768;
function isMobile() { return window.innerWidth <= MOBILE_BREAKPOINT; }

/* ===== СТРАНИЦЫ ===== */
const pagesData = [
    {
        left: `В давние времена, когда мир был ещё молод, древние силы сплели нити судьбы в единое полотно. Это полотно хранит тайны каждого живого существа. <span class="owl-word" data-img="taro sova.png" data-meaning="Твоя семья завтра сдохнет от бомбардировки">Сова</span> — хранительница этих тайн, она видит то, что скрыто от глаз смертных.`,
        right: `Легенды гласят, что тот, кто осмелится заглянуть в глубины этой книги, увидит свою судьбу. Но будь осторожен — не всё, что ты увидишь, тебе понравится.`
    },
    {
        left: `Вторая страница открывает перед тобой карту. Карта — это не просто бумага, это отражение твоего будущего. Каждая карта уникальна, как уникален путь каждого человека.`,
        right: `Некоторые карты предвещают радость и успех, другие — испытания и потери. Но все они говорят правду, какой бы горькой она ни была. А маленькая <span class="sheep-word" data-img="sheep.png" data-meaning="Овечка шепчет: не бойся быть белой вороной — ты не одна такая">овечка</span> знает: даже самый тихий голос слышен.`
    },
    {
        left: `Третья страница — последняя. Здесь заканчивается путь обычного читателя и начинается путь избранного. Ты дошёл до конца книги, но это только начало твоего пути.`,
        right: `Помни: судьба не предопределена. Каждый выбор, каждое действие меняет узор на полотне. Используй знания мудро. И запомни: <span class="croc-word" data-img="grimm.png" data-meaning="Крокодил предрекает перемены, которых ты так боялся">Крокодил</span> — не всегда враг. А <span class="tiger-word" data-img="tigr.png" data-meaning="Тигр говорит: полосат, да не кот — иди вперёд, не оглядывайся">Тигр</span> — не всегда кот.`
    }
];

const bookCover = document.getElementById('bookCover');
const book3d = document.getElementById('book3d');
const slotLeft = document.getElementById('slotLeft');
const slotRight = document.getElementById('slotRight');
const pageIndicator = document.getElementById('pageIndicator');
const prevBtn = document.getElementById('prevPage');
const nextBtn = document.getElementById('nextPage');
const closeBookBtn = document.getElementById('closeBook');

let currentSpread = 0;
let isAnimating = false;
let bookOpened = false;

function renderPage(container, html, side) {
    container.innerHTML = '';
    const page = document.createElement('div');
    page.className = `book-page ${side}-page`;
    page.innerHTML = html;
    container.appendChild(page);
    return page;
}

function renderSpread(idx) {
    if (isMobile()) {
        const combined = pagesData[idx].left + '<br><br>' + pagesData[idx].right;
        renderPage(slotLeft, combined, 'left');
        slotRight.innerHTML = '';
    } else {
        renderPage(slotLeft, pagesData[idx].left, 'left');
        renderPage(slotRight, pagesData[idx].right, 'right');
    }
    bindClickWords();
    pageIndicator.textContent = `${idx + 1} / ${pagesData.length}`;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === pagesData.length - 1;
}

function bindClickWords() {
    document.querySelectorAll('.owl-word, .croc-word, .tiger-word, .sheep-word').forEach(word => {
        if (word.dataset.bound) return;
        word.dataset.bound = '1';
        word.addEventListener('click', triggerWord);
    });
}

function openBook() {
    if (bookOpened) return;
    bookOpened = true;
    bookCover.classList.add('shake');
    setTimeout(() => bookCover.classList.add('opening'), 700);
    setTimeout(() => {
        bookCover.style.display = 'none';
        book3d.classList.add('visible');
        renderSpread(0);
    }, 1600);
}
function closeBook() {
    book3d.classList.remove('visible');
    bookCover.style.display = '';
    bookCover.classList.remove('opening');
    bookOpened = false;
    currentSpread = 0;
}
bookCover.addEventListener('click', openBook);
closeBookBtn.addEventListener('click', closeBook);

window.addEventListener('resize', () => {
    if (bookOpened) renderSpread(currentSpread);
});

/* ===== ПЕРЕЛИСТЫВАНИЕ ===== */
let dragState = null;

function onDragStart(e) {
    if (isAnimating) return;
    if (e.target.closest('button')) return;
    if (e.target.closest('.owl-word, .croc-word, .tiger-word, .sheep-word')) return;
    if (!book3d.classList.contains('visible')) return;

    const rect = book3d.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const half = rect.width / 2;
    const side = isMobile() ? 'right' : (x > half ? 'right' : 'left');

    if (side === 'right' && currentSpread >= pagesData.length - 1) return;
    if (side === 'left' && currentSpread <= 0) return;

    dragState = { startX: e.clientX, startY: e.clientY, side, dragging: false, flipEl: null, lastAngle: 0 };
    book3d.setPointerCapture(e.pointerId);
}

function onDragMove(e) {
    if (!dragState) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;

    if (!dragState.dragging) {
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
            dragState.dragging = true;
            const source = dragState.side === 'right' ? slotRight : slotLeft;
            const flip = document.createElement('div');
            flip.className = `flip-page flip-${dragState.side}`;
            flip.innerHTML = source.innerHTML;
            book3d.appendChild(flip);
            dragState.flipEl = flip;
        }
    }
    if (!dragState.dragging) return;

    const W = book3d.getBoundingClientRect().width / (isMobile() ? 1 : 2);
    let angle;
    if (dragState.side === 'right') angle = Math.max(-180, Math.min(0, (dx / W) * 180));
    else angle = Math.max(0, Math.min(180, (dx / W) * 180));
    dragState.lastAngle = angle;
    dragState.flipEl.style.transform = `rotateY(${angle}deg)`;
}

function onDragEnd() {
    if (!dragState) return;
    const state = dragState;
    dragState = null;
    if (!state.dragging || !state.flipEl) return;

    const flip = state.flipEl;
    const angle = state.lastAngle;
    const threshold = 50;
    const complete = state.side === 'right' ? angle < -threshold : angle > threshold;

    if (complete) {
        const target = state.side === 'right' ? -180 : 180;
        flip.style.transition = 'transform 0.4s ease-in, opacity 0.4s ease-in';
        requestAnimationFrame(() => {
            flip.style.transform = `rotateY(${target}deg)`;
            flip.style.opacity = '0';
        });
        setTimeout(() => {
            flip.remove();
            if (state.side === 'right') { currentSpread++; renderSpread(currentSpread); }
            else { currentSpread--; renderSpread(currentSpread); }
        }, 400);
    } else {
        flip.style.transition = 'transform 0.35s ease-out';
        requestAnimationFrame(() => { flip.style.transform = 'rotateY(0deg)'; });
        setTimeout(() => flip.remove(), 350);
    }
}

book3d.addEventListener('pointerdown', onDragStart);
book3d.addEventListener('pointermove', onDragMove);
book3d.addEventListener('pointerup', onDragEnd);
book3d.addEventListener('pointercancel', onDragEnd);

function goNext() {
    if (isAnimating || currentSpread >= pagesData.length - 1) return;
    isAnimating = true;
    const flip = document.createElement('div');
    flip.className = 'flip-page flip-right';
    flip.innerHTML = isMobile() ? slotLeft.innerHTML : slotRight.innerHTML;
    book3d.appendChild(flip);
    requestAnimationFrame(() => {
        flip.style.transition = 'transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.7s';
        flip.style.transform = 'rotateY(-180deg)';
        flip.style.opacity = '0';
    });
    setTimeout(() => {
        flip.remove();
        currentSpread++;
        renderSpread(currentSpread);
        isAnimating = false;
    }, 700);
}
function goPrev() {
    if (isAnimating || currentSpread <= 0) return;
    isAnimating = true;
    const flip = document.createElement('div');
    flip.className = 'flip-page flip-left';
    flip.innerHTML = slotLeft.innerHTML;
    book3d.appendChild(flip);
    requestAnimationFrame(() => {
        flip.style.transition = 'transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.7s';
        flip.style.transform = 'rotateY(180deg)';
        flip.style.opacity = '0';
    });
    setTimeout(() => {
        flip.remove();
        currentSpread--;
        renderSpread(currentSpread);
        isAnimating = false;
    }, 700);
}
nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);

/* ===== КЛИК ПО СЛОВУ ===== */
function triggerWord(e) {
    e.stopPropagation();
    const word = e.currentTarget;
    const img = word.dataset.img;
    const meaning = word.dataset.meaning;
    let color = '#ffd84d';
    if (word.classList.contains('croc-word')) color = '#7ed957';
    else if (word.classList.contains('tiger-word')) color = '#ff9a3c';
    else if (word.classList.contains('sheep-word')) color = '#a8c8e8';

    if (isCardUnlocked(img)) return;

    const rect = word.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 20; i++) {
        const star = document.createElement('div');
        star.className = 'star-particle';
        star.textContent = Math.random() > 0.5 ? '★' : '✦';
        star.style.color = color;
        star.style.fontSize = (10 + Math.random() * 14) + 'px';
        star.style.left = cx + 'px';
        star.style.top = cy + 'px';
        const angle = (Math.PI * 2 * i) / 20 + (Math.random() - 0.5) * 0.6;
        const dist = 100 + Math.random() * 220;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist - 40;
        const rot = (Math.random() - 0.5) * 720;
        document.body.appendChild(star);
        star.animate([
            { transform: 'translate(0,0) scale(1) rotate(0)', opacity: 1 },
            { transform: `translate(${tx}px, ${ty}px) scale(0.3) rotate(${rot}deg)`, opacity: 0 }
        ], { duration: 900 + Math.random() * 600, easing: 'cubic-bezier(0.15, 0.6, 0.4, 1)', fill: 'forwards' });
        setTimeout(() => star.remove(), 1700);
    }

    setTimeout(() => spawnFlyingCard(img, meaning), 300);
}

/* ===== КАРТА ===== */
function spawnFlyingCard(img, meaning) {
    if (document.querySelector('.card-flight-overlay')) return;

    const overlay = document.createElement('div');
    overlay.className = 'card-flight-overlay';

    const card = document.createElement('div');
    card.className = 'flight-card';
    card.innerHTML = `<img src="${img}" alt="Карта"
        onerror="this.style.minHeight='380px';this.style.background='linear-gradient(135deg,#d0a043,#633207)';this.removeAttribute('src');">`;

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'Закрыть';
    const catalogBtn = document.createElement('button');
    catalogBtn.textContent = 'В галерею';
    actions.appendChild(closeBtn);
    actions.appendChild(catalogBtn);

    overlay.appendChild(card);
    overlay.appendChild(actions);
    document.body.appendChild(overlay);

    setTimeout(() => {
        overlay.classList.add('reveal');
        card.classList.add('settled');
    }, 2600);

    card.addEventListener('pointermove', (ev) => {
        if (!card.classList.contains('settled')) return;
        const r = card.getBoundingClientRect();
        const mx = (ev.clientX - r.left) / r.width - 0.5;
        const my = (ev.clientY - r.top) / r.height - 0.5;
        const rx = -my * 18;
        const ry = mx * 18;
        card.style.transform = `perspective(800px) scale(1) rotate(1080deg) rotateX(${rx}deg) rotateY(${ry}deg)`;
    });
    card.addEventListener('pointerleave', () => {
        if (!card.classList.contains('settled')) return;
        card.style.transform = `perspective(800px) scale(1) rotate(1080deg)`;
    });

    function removeOverlay() {
        overlay.style.transition = 'opacity 0.4s';
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 400);
    }
    function unlockAndClose(goToGallery) {
        unlockCard(img, meaning);
        removeOverlay();
        if (goToGallery) showSection('gallery');
    }

    closeBtn.addEventListener('click', () => unlockAndClose(false));
    catalogBtn.addEventListener('click', () => unlockAndClose(true));
    overlay.addEventListener('click', (ev) => {
        if (ev.target === overlay) unlockAndClose(false);
    });
}

/* ===== ГАЛЕРЕЯ — ДОСКА ===== */
const galleryGrid = document.getElementById('galleryGrid');

function buildGallery() {
    galleryGrid.innerHTML = '';
    for (let i = 0; i < TOTAL_CARDS; i++) {
        const cell = document.createElement('div');
        cell.className = 'gallery-cell';
        const tilt = ((i * 37) % 11) - 5;

        const state = cardStates[i];
        if (state) {
            const card = document.createElement('div');
            card.className = 'gallery-card opened';
            card.style.setProperty('--tilt', tilt + 'deg');
            card.innerHTML = `<img src="${state.img}" alt="Карта"
                onerror="this.style.minHeight='200px';this.style.background='linear-gradient(135deg,#d0a043,#633207)';this.removeAttribute('src');">`;
            cell.appendChild(card);
            const meaning = document.createElement('div');
            meaning.className = 'gallery-meaning';
            meaning.textContent = state.meaning;
            cell.appendChild(meaning);
        } else {
            const card = document.createElement('div');
            card.className = 'gallery-card dark';
            card.style.setProperty('--tilt', tilt + 'deg');
            const sticker = document.createElement('div');
            sticker.className = 'sticker';
            sticker.textContent = 'позже';
            card.appendChild(sticker);
            cell.appendChild(card);
        }
        galleryGrid.appendChild(cell);
    }
}

/* ===== СТАРТ ===== */
loadStates();
showSection('main');
</script>
</body>
</html>
